<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="60%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>
    <linearGradient id="noteCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="noteGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="notePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="#222738" stroke-width="4"/>

  <!-- Falling Note Columns / Guides -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,8">
    <line x1="140" y1="60" x2="140" y2="350" />
    <line x1="200" y1="60" x2="200" y2="350" />
    <line x1="260" y1="60" x2="260" y2="350" />
    <line x1="320" y1="60" x2="320" y2="350" />
    <line x1="380" y1="60" x2="380" y2="350" />
  </g>

  <!-- Falling Synthesia Notes with Glow -->
  <g filter="url(#glow)">
    <!-- Cyan bar -->
    <rect x="125" y="160" width="30" height="120" rx="6" fill="url(#noteCyan)" />
    <!-- Pink bar -->
    <rect x="185" y="100" width="30" height="80" rx="6" fill="url(#notePink)" />
    <!-- Green bar -->
    <rect x="245" y="190" width="30" height="150" rx="6" fill="url(#noteGreen)" />
    <!-- Cyan bar 2 -->
    <rect x="305" y="130" width="30" height="100" rx="6" fill="url(#noteCyan)" />
    <!-- Pink bar 2 -->
    <rect x="365" y="80" width="30" height="180" rx="6" fill="url(#notePink)" />
  </g>

  <!-- Red Felt Strip (Synthesia / Grand Piano Signature) -->
  <rect x="56" y="348" width="400" height="8" rx="2" fill="#ef4444" opacity="0.9" />

  <!-- Piano Keyboard Section -->
  <g>
    <!-- White Keys Base -->
    <rect x="56" y="356" width="400" height="96" rx="6" fill="#f8fafc" />
    
    <!-- White Key Separators -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="106" y1="356" x2="106" y2="452" />
      <line x1="156" y1="356" x2="156" y2="452" />
      <line x1="206" y1="356" x2="206" y2="452" />
      <line x1="256" y1="356" x2="256" y2="452" />
      <line x1="306" y1="356" x2="306" y2="452" />
      <line x1="356" y1="356" x2="356" y2="452" />
      <line x1="406" y1="356" x2="406" y2="452" />
    </g>

    <!-- Black Keys -->
    <rect x="91" y="356" width="28" height="58" rx="3" fill="#1e293b" />
    <rect x="141" y="356" width="28" height="58" rx="3" fill="#1e293b" />
    
    <rect x="241" y="356" width="28" height="58" rx="3" fill="#1e293b" />
    <rect x="291" y="356" width="28" height="58" rx="3" fill="#1e293b" />
    <rect x="341" y="356" width="28" height="58" rx="3" fill="#1e293b" />
  </g>

  <!-- Key Hit Highlight (Green on key 4) -->
  <rect x="241" y="356" width="28" height="58" rx="3" fill="#10b981" opacity="0.9" />
  <ellipse cx="255" cy="354" rx="16" ry="6" fill="#6ee7b7" filter="url(#glow)" />
</svg>
